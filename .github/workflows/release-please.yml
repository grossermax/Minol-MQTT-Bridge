name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Creates/updates a "release PR" that collects all Conventional Commits,
      # bumps the version in config.yaml and regenerates the full CHANGELOG.md
      # in the repository root. Merging that PR publishes a GitHub Release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Home Assistant surfaces minol_mqtt_bridge/CHANGELOG.md as the add-on
      # changelog and always shows it in full. To only display the newest
      # release there, we trim the root CHANGELOG.md down to its latest version
      # block (everything up to the second "## [" heading) and commit it into
      # the add-on folder. The full history stays in the root CHANGELOG.md.
      #
      # `main` is a protected branch, so we cannot push there directly. Instead
      # we commit the trimmed add-on changelog onto the open release PR branch
      # that release-please maintains. When that PR is merged, the file lands on
      # `main` through the regular (protection-compliant) pull request flow.
      - name: Localize release date and sync add-on changelog on release PR branch
        if: ${{ steps.release.outputs.pr }}
        env:
          # Pass the raw PR JSON string through; parsing happens at runtime with
          # jq. Using fromJSON() here would fail template evaluation on runs
          # where no release PR exists (empty string -> invalid JSON).
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          # release-please always stamps the changelog/PR date in UTC (the date
          # is hard-coded to UTC inside conventional-changelog-writer). Rewrite
          # it to this local timezone instead so the header shows the date as it
          # is where the release is cut.
          LOCAL_TZ: Europe/Berlin
          # Needed for `gh` to edit the release PR description.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_PR_BRANCH="$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')"
          RELEASE_PR_NUMBER="$(printf '%s' "$RELEASE_PR" | jq -r '.number')"
          git fetch origin "$RELEASE_PR_BRANCH"
          git checkout "$RELEASE_PR_BRANCH"

          # Compute the local date for the timezone above. release-please writes
          # the newest version header as e.g. "## [1.4.0](url) (2026-08-25)" with
          # the date in UTC; we swap that date for the local one.
          LOCAL_DATE="$(TZ="$LOCAL_TZ" date +%F)"
          echo "Using local release date $LOCAL_DATE ($LOCAL_TZ)."

          # Replace the date only on the first (newest) "## [" version header,
          # leaving historical entries untouched.
          replace_first_header_date() {
            # $1 = file to edit
            awk -v ld="$LOCAL_DATE" '
              !done && /^## \[/ {
                sub(/\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\)/, "(" ld ")")
                done = 1
              }
              { print }
            ' "$1" > "$1.tmp" && mv "$1.tmp" "$1"
          }

          # Localize the date in the full root changelog first...
          replace_first_header_date CHANGELOG.md
          # ...then trim it to just the newest version block for the add-on
          # (Home Assistant shows the add-on CHANGELOG.md in full).
          awk '/^## \[/ { count++; if (count == 2) exit } { print }' \
            CHANGELOG.md > minol_mqtt_bridge/CHANGELOG.md
          # Drop trailing blank lines for a tidy file.
          sed -i -e :a -e '/^\n*$/{$d;N;ba}' minol_mqtt_bridge/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md minol_mqtt_bridge/CHANGELOG.md
          if git diff --staged --quiet; then
            echo "Changelogs already up to date."
          else
            git commit -m "chore: localize release date and sync add-on changelog for Home Assistant"
            git push origin "HEAD:$RELEASE_PR_BRANCH"
          fi

          # release-please renders the PR description from the same UTC-stamped
          # changelog, so localize the date there as well.
          gh pr view "$RELEASE_PR_NUMBER" --json body --jq .body > pr_body.md
          replace_first_header_date pr_body.md
          gh pr edit "$RELEASE_PR_NUMBER" --body-file pr_body.md
          rm -f pr_body.md
