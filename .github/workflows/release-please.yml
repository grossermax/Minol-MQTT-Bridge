name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Creates/updates a "release PR" that collects all Conventional Commits,
      # bumps the version in config.yaml and regenerates the full CHANGELOG.md
      # in the repository root. Merging that PR publishes a GitHub Release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Home Assistant surfaces minol_mqtt_bridge/CHANGELOG.md as the add-on
      # changelog and always shows it in full. To only display the newest
      # release there, we trim the root CHANGELOG.md down to its latest version
      # block (everything up to the second "## [" heading) and commit it into
      # the add-on folder. The full history stays in the root CHANGELOG.md.
      #
      # `main` is a protected branch, so we cannot push there directly. Instead
      # we commit the trimmed add-on changelog onto the open release PR branch
      # that release-please maintains. When that PR is merged, the file lands on
      # `main` through the regular (protection-compliant) pull request flow.
      - name: Sync add-on changelog on release PR branch
        if: ${{ steps.release.outputs.pr }}
        env:
          RELEASE_PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_PR_BRANCH"
          git checkout "$RELEASE_PR_BRANCH"
          # release-please has already regenerated the full root CHANGELOG.md on
          # this branch; trim it to just the newest version block for the add-on.
          awk '/^## \[/ { count++; if (count == 2) exit } { print }' \
            CHANGELOG.md > minol_mqtt_bridge/CHANGELOG.md
          # Drop trailing blank lines for a tidy file.
          sed -i -e :a -e '/^\n*$/{$d;N;ba}' minol_mqtt_bridge/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minol_mqtt_bridge/CHANGELOG.md
          if git diff --staged --quiet; then
            echo "Add-on changelog already up to date."
          else
            git commit -m "chore: sync add-on changelog for Home Assistant"
            git push origin "HEAD:$RELEASE_PR_BRANCH"
          fi

