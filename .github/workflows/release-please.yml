name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Creates/updates a "release PR" that collects all Conventional Commits,
      # bumps the version in config.yaml and regenerates
      # minol_mqtt_bridge/CHANGELOG.md. Merging that PR publishes a GitHub
      # Release (which Home Assistant can surface as the add-on changelog).
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

